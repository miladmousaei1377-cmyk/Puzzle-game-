name: bagh_khamosh
description: "باغ خاموش — بازی پازلی"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local storage
  hive_flutter: ^1.1.0

  # Routing
  go_router: ^14.8.1

  # Localization
  intl: ^0.20.2

  # Audio
  audioplayers: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EDE6D6"
  adaptive_icon_foreground: "assets/images/icons/app_icon.png"

flutter_native_splash:
  color: "#EDE6D6"
  image: assets/images/icons/app_icon.png
  android_12:
    color: "#EDE6D6"
    image: assets/images/icons/app_icon.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/puzzles/
    - assets/images/backgrounds/
    - assets/images/objects/
    - assets/images/symbols/
    - assets/images/icons/
    - assets/sounds/ambient/
    - assets/sounds/sfx/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
